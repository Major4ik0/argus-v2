name: Build Docker Image and Publish to Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs pull

      - name: Extract version from commit message
        id: get_version
        run: |
          # Получаем первую строку сообщения коммита
          MSG="${{ github.event.head_commit.message }}"
          FIRST_LINE=$(echo "$MSG" | head -n 1 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          
          # Ищем шаблон версии вида v1, v2, v3, v3.1 или берем текст коммита
          if [[ "$FIRST_LINE" =~ (v[0-9]+(\.[0-9]+)*) ]]; then
            VER="${BASH_REMATCH[1]}"
          elif [ -n "$FIRST_LINE" ] && [ ${#FIRST_LINE} -le 12 ]; then
            VER="$FIRST_LINE"
          else
            VER="v3"
          fi
          
          echo "RELEASE_TAG=$VER" >> $GITHUB_ENV
          echo "Используется версия: $VER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: argus-v2:${{ env.RELEASE_TAG }}

      - name: Save Docker image to compressed tar
        run: |
          docker save argus-v2:${{ env.RELEASE_TAG }} | gzip > argus_${{ env.RELEASE_TAG }}.tar.gz

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Argus ${{ env.RELEASE_TAG }} — Готовый контейнер для сервера"
          body: |
            Автономный образ Docker (версия ${{ env.RELEASE_TAG }}) для развертывания на закрытом сервере академии.

            ### Инструкция по запуску:
            1. Загрузить образ в Docker:
               ```bash
               gunzip -c argus_${{ env.RELEASE_TAG }}.tar.gz | docker load
               ```
            2. Запустить контейнер:
               ```bash
               docker run -d -p 8000:8000 --name argus-app --restart always argus-v2:${{ env.RELEASE_TAG }}
               ```
          files: argus_${{ env.RELEASE_TAG }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
