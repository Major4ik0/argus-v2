<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Как работает табло АРГУС</title>
  <desc id="d">Схематичная анимация: камера замечает преподавателя, система его распознаёт, и табло показывает его персональное расписание.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b1646"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cam"><rect x="40" y="80" width="440" height="380" rx="18"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>

  <rect width="960" height="520" rx="24" fill="url(#bg)"/>

  <!-- Шапка -->
  <text x="40" y="52" font-size="20" font-weight="700" fill="#ffffff">АРГУС</text>
  <rect x="40" y="58" width="48" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="124" y="52" font-size="13" fill="#94a3b8">информационное табло с распознаванием лиц</text>

  <!-- Камера -->
  <rect x="40" y="80" width="440" height="380" rx="18" fill="#0a0f1d" stroke="#243049"/>
  <g clip-path="url(#cam)">
    <rect x="40" y="80" width="440" height="380" fill="#0d1426"/>
    <g opacity="0">
      <circle cx="260" cy="236" r="48" fill="#3b4a66"/>
      <path d="M160 460 C166 350 354 350 360 460 Z" fill="#3b4a66"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.30;0.80;0.8667;1" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="64" cy="104" r="5" fill="#ef4444">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="76" y="109" font-size="12" font-weight="700" fill="#fca5a5">LIVE</text>
  <text class="mono" x="120" y="109" font-size="12" fill="#64748b">/api/v1/kiosk/video_feed</text>

  <!-- Рамка детекции -->
  <rect x="198" y="178" width="124" height="124" rx="12" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="500" stroke-dashoffset="500" opacity="0" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="500;500;0;0;500;500" keyTimes="0;0.30;0.3667;0.80;0.8667;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.31;0.8667;0.88;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <!-- Линия сканирования -->
  <rect x="198" y="178" width="124" height="3" rx="1.5" fill="#4ade80" opacity="0" filter="url(#glow)">
    <animate attributeName="y" values="178;178;299;299" keyTimes="0;0.3667;0.45;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.3667;0.38;0.445;0.455;1" dur="12s" repeatCount="indefinite"/>
  </rect>
  <!-- Метка «распознан» -->
  <g opacity="0">
    <rect x="172" y="136" width="176" height="28" rx="14" fill="#052e16" stroke="#22c55e"/>
    <text x="260" y="155" font-size="13" font-weight="700" text-anchor="middle" fill="#4ade80">✓ ArcFace · 512-d</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.48;0.80;0.833;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Экран табло -->
  <rect x="510" y="80" width="410" height="380" rx="18" fill="#0a0f1d" stroke="#243049"/>

  <!-- Режим ожидания: карусель расписания -->
  <g>
    <text x="530" y="118" font-size="18" font-weight="700" fill="#ffffff">Расписание кафедры</text>
    <text x="530" y="138" font-size="12" fill="#64748b">сегодня</text>
    <rect x="530" y="150" width="370" height="40" rx="10" fill="#38bdf8" opacity="0.14">
      <animate attributeName="y" values="150;196;242;288;150" keyTimes="0;0.25;0.5;0.75;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <g font-size="15">
      <rect x="530" y="150" width="370" height="40" rx="10" fill="none" stroke="#1f2a44"/>
      <text x="546" y="176" font-weight="700" fill="#38bdf8">08:30</text>
      <text x="616" y="176" fill="#e2e8f0">Высшая математика</text>
      <text x="884" y="176" font-size="13" text-anchor="end" fill="#94a3b8">ауд. 214</text>

      <rect x="530" y="196" width="370" height="40" rx="10" fill="none" stroke="#1f2a44"/>
      <text x="546" y="222" font-weight="700" fill="#38bdf8">10:10</text>
      <text x="616" y="222" fill="#e2e8f0">Информатика</text>
      <text x="884" y="222" font-size="13" text-anchor="end" fill="#94a3b8">ауд. 305</text>

      <rect x="530" y="242" width="370" height="40" rx="10" fill="none" stroke="#1f2a44"/>
      <text x="546" y="268" font-weight="700" fill="#38bdf8">12:20</text>
      <text x="616" y="268" fill="#e2e8f0">Физика</text>
      <text x="884" y="268" font-size="13" text-anchor="end" fill="#94a3b8">ауд. 118</text>

      <rect x="530" y="288" width="370" height="40" rx="10" fill="none" stroke="#1f2a44"/>
      <text x="546" y="314" font-weight="700" fill="#38bdf8">14:00</text>
      <text x="616" y="314" fill="#e2e8f0">Базы данных</text>
      <text x="884" y="314" font-size="13" text-anchor="end" fill="#94a3b8">ауд. 402</text>
    </g>
    <text x="715" y="430" font-size="13" text-anchor="middle" fill="#64748b">Подойдите к камере — покажем ваше расписание</text>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.45;0.4833;0.8333;0.8667;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- Персональное расписание -->
  <g opacity="0">
    <text x="530" y="118" font-size="18" font-weight="700" fill="#ffffff">Иванов И.И.</text>
    <text x="530" y="138" font-size="12" fill="#64748b">ваше расписание на неделю</text>
    <g font-size="15">
      <rect x="530" y="150" width="370" height="40" rx="10" fill="#111a2e" stroke="#1f2a44"/>
      <rect x="530" y="150" width="4" height="40" rx="2" fill="#38bdf8"/>
      <text x="548" y="176" font-weight="700" fill="#38bdf8">Пн 08:30</text>
      <text x="632" y="176" fill="#e2e8f0">Высшая математика</text>

      <rect x="530" y="196" width="370" height="40" rx="10" fill="#111a2e" stroke="#1f2a44"/>
      <rect x="530" y="196" width="4" height="40" rx="2" fill="#818cf8"/>
      <text x="548" y="222" font-weight="700" fill="#818cf8">Вт 10:10</text>
      <text x="632" y="222" fill="#e2e8f0">Высшая математика</text>

      <rect x="530" y="242" width="370" height="40" rx="10" fill="#111a2e" stroke="#1f2a44"/>
      <rect x="530" y="242" width="4" height="40" rx="2" fill="#34d399"/>
      <text x="548" y="268" font-weight="700" fill="#34d399">Ср 12:20</text>
      <text x="632" y="268" fill="#e2e8f0">Консультация</text>

      <rect x="530" y="288" width="370" height="40" rx="10" fill="#111a2e" stroke="#1f2a44"/>
      <rect x="530" y="288" width="4" height="40" rx="2" fill="#fbbf24"/>
      <text x="548" y="314" font-weight="700" fill="#fbbf24">Чт 08:30</text>
      <text x="632" y="314" fill="#e2e8f0">Высшая математика</text>
    </g>
    <text x="715" y="430" font-size="13" text-anchor="middle" fill="#64748b">Хорошего дня!</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4667;0.5;0.80;0.8333;1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- События WebSocket -->
  <g opacity="0">
    <rect x="290" y="474" width="380" height="30" rx="15" fill="#0c2a3a" stroke="#38bdf8"/>
    <text class="mono" x="480" y="494" font-size="13" text-anchor="middle" fill="#7dd3fc">WebSocket → TEACHER_DETECTED</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.48;0.75;0.78;1" dur="12s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <rect x="290" y="474" width="380" height="30" rx="15" fill="#3a2a0c" stroke="#fbbf24"/>
    <text class="mono" x="480" y="494" font-size="13" text-anchor="middle" fill="#fcd34d">WebSocket → TIMEOUT_EXPIRED</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8167;0.85;0.9167;0.95;1" dur="12s" repeatCount="indefinite"/>
  </g>
</svg>
